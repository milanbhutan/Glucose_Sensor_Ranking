[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "mcx_glucose_framework"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pandas", "matplotlib", "scipy", "pmcx", "scikit-learn"]

[tool.setuptools]
package-dir = {"" = "MCeXtreme_Sim/src"}
py-modules = ["paths"]

[tool.setuptools.packages.find]
where = ["MCeXtreme_Sim/src"]
